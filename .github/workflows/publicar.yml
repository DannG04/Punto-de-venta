# Botón "Publicar versión": Actions → Publicar versión → Run workflow (rama master).
# Corre las pruebas y, si pasan, publica el release que descargan las tiendas
# (installer/update/publicar_version.ps1). Con "simular" arma el ZIP sin publicar.
name: Publicar versión

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (p. ej. 1.23). Debe ser mayor que el último release.'
        required: true
        type: string
      notas:
        description: 'Novedades en una línea. Para notas largas déjalo vacío y haz commit de notas/v<versión>.md'
        required: false
        type: string
        default: ''
      simular:
        description: 'Simular: arma el ZIP (descargable) sin publicar nada'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validar:
    name: validar
    runs-on: ubuntu-latest
    steps:
      - name: Solo se publica desde master
        if: ${{ !inputs.simular && github.ref != 'refs/heads/master' }}
        run: |
          echo "::error::Solo se publica desde master (se eligió ${GITHUB_REF})."
          exit 1
      - run: echo "Rama ${GITHUB_REF}, simular=${{ inputs.simular }}"

  pruebas:
    needs: validar
    uses: ./.github/workflows/pruebas.yml

  publicar:
    name: publicar
    needs: pruebas
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Las entradas van por variables de entorno (no interpoladas en el script)
      VERSION: ${{ inputs.version }}
      NOTAS: ${{ inputs.notas }}
      SIMULAR: ${{ inputs.simular }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      # Se cachean SOLO los archivos descargados (zip del JRE y exe de PostgreSQL), nunca la
      # carpeta jre descomprimida: preparar_dependencias.ps1 re-verifica su huella en cada
      # corrida y reconstruye installer/jre desde el zip, así una caché alterada no llega al instalador.
      - name: Cache de dependencias del instalador
        uses: actions/cache@v4
        with:
          path: |
            installer/jre.zip
            installer/postgresql-18.1-2-windows-x64.exe
          key: instalador-deps-${{ hashFiles('installer/preparar_dependencias.ps1') }}

      - name: Preparar JRE y PostgreSQL (descarga verificada)
        shell: pwsh
        run: ./installer/preparar_dependencias.ps1

      # Inno Setup 6 (el runner lo trae; si no, versión fijada) y ruta explícita para el script
      - name: Asegurar Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --version 6.3.2 -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "No se encontró Inno Setup 6 en $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publicar
        shell: pwsh
        # publicar_ci.ps1 lee VERSION/NOTAS/SIMULAR/JAVA_HOME y está cubierto por probar_publicar.ps1
        run: ./installer/update/publicar_ci.ps1

      - name: Guardar el paquete y el instalador (simulación)
        if: ${{ inputs.simular }}
        uses: actions/upload-artifact@v4
        with:
          name: PuntoVenta-${{ inputs.version }}
          path: |
            installer/output/PuntoVenta-Update-*.zip
            installer/output/PuntoVenta-Update-*.zip.sha256
            installer/output/PuntoVentaSetup.exe
